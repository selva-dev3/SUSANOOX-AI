[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "susanoox"
version = "0.1.0"
description = "A secure, full-screen AI coding agent for the terminal"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Susanoox Contributors" }]
keywords = ["ai", "cli", "coding-agent", "textual", "terminal"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "keyring>=25.6,<27",
  "openai>=1.68,<3",
  "pillow>=11.3,<13",
  "platformdirs>=4.3,<5",
  "textual>=1.0,<9",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pyright>=1.1.390,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
]

[project.scripts]
susanoox = "susanoox.cli:main"

[project.urls]
Homepage = "https://github.com/selva-dev3/SUSANOOX-AI"
Issues = "https://github.com/selva-dev3/SUSANOOX-AI/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/susanoox"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE", "/SECURITY.md"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S105", "S106"]
